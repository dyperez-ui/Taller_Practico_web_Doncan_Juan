<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Memorama</title>
    <link rel="stylesheet" href="memorama.css">
</head>
<body>
    <div class="Contenedor-memorama">
        <header>    
            <h1>Memorama</h1>
            <div class="tiempo">
                <span>Tiempo: </span>
                <span id="tiempoId">00:00</span>
            </div>
        </header>

        <div class="controles-nivel">
            <button onclick="cambiarNivel('facil')">Fácil (8 cartas)</button>
            <button onclick="cambiarNivel('medio')">Medio (12 cartas)</button> 
            <button onclick="cambiarNivel('dificil')">Difícil (20 cartas)</button>
        </div>

        <main>
            <div class="memorama-inicio"></div>
        </main>

        <div class="info-intentos">
            <span>Intentos: </span>
            <span id="intentosId">0</span>
        </div> 
    </div>

    <script src="memorama.js"></script>
</body>
</html>
